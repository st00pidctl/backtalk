name: universal-core-check

on:
  push:
    branches: [universal-core-architecture]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile universal core modules
        run: |
          python -m py_compile \
            backtalk/brain.py \
            backtalk/core_base.py \
            backtalk/core_registry.py \
            backtalk/core_claude.py \
            backtalk/core_codex.py \
            backtalk/core_generic.py \
            backtalk/core_probe.py \
            backtalk/core_smoke.py \
            examples/custom_core.py
      - name: Verify Codex headless permission mapping
        run: |
          python - <<'PY'
          from backtalk.config import CFG
          from backtalk.core_codex import CodexBrain

          original = CFG.get("permission_mode")
          try:
              CFG["permission_mode"] = "ask"
              args = CodexBrain()._permission_args()
              assert args == [
                  "--sandbox", "workspace-write",
                  "-c", 'approval_policy="never"',
              ]
              assert "--approve-for-me" not in args

              CFG["permission_mode"] = "read-only"
              args = CodexBrain()._permission_args()
              assert args == [
                  "--sandbox", "read-only",
                  "-c", 'approval_policy="never"',
              ]
          finally:
              CFG["permission_mode"] = original
          PY
      - name: Verify drop-in adapter loader
        run: |
          python - <<'PY'
          from backtalk.core_registry import load_core_class
          cls = load_core_class(
              "example",
              adapter="examples/custom_core.py:MyRuntimeBrain",
          )
          assert cls.__name__ == "MyRuntimeBrain"
          PY
      - name: Validate example JSON
        run: python -m json.tool backtalk.json.example >/dev/null
